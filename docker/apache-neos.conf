<VirtualHost *:80>
    DocumentRoot /app/Web
    PassEnv FLOW_CONTEXT
    PassEnv DB_HOST DB_NAME DB_USER DB_PASSWORD
    <Directory /app/Web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
