Neos:
  Neos:
    sites:
      # Site-Knoten "astronomique": Deutsch ist Standard ("/" zeigt Deutsch)
      'astronomique':
        preset: default
        contentDimensions:
          defaultDimensionSpacePoint:
            language: de
          resolver:
            factoryClassName: Neos\Neos\FrontendRouting\DimensionResolution\Resolver\UriPathResolverFactory
            options:
              segments:
                - dimensionIdentifier: language
                  dimensionValueMapping:
                    de: de
                    en_US: en
                    en_GB: uk
