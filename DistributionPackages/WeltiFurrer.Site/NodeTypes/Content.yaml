      type: string
      ui:
        inlineEditable: true
        inline:
          editorOptions:
            autoparagraph: false
            placeholder: 'Telefon'
    anchor:
      type: string
      ui:
        label: 'Sprungmarke (ohne #)'
        reloadIfChanged: true
        inspector:
          group: 'type'

# --- Fliesstext ------------------------------------------------------------
'WeltiFurrer.Site:Content.Text':
  superTypes:
    'WeltiFurrer.Site:Content': true
    'WeltiFurrer.Site:Mixin.Headline': true
    'WeltiFurrer.Site:Mixin.Text': true
  ui:
    label: 'Text'
    icon: 'align-left'
  properties:
