    icon: 'newspaper'
  childNodes:
    items:
      type: 'WeltiFurrer.Site:Collection.News'

'WeltiFurrer.Site:Collection.News':
  superTypes:
    'Neos.Neos:ContentCollection': true
  constraints:
    nodeTypes:
