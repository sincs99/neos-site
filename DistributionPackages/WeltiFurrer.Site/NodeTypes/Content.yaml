    'WeltiFurrer.Site:Content': true
    'WeltiFurrer.Site:Mixin.Text': true
    'WeltiFurrer.Site:Mixin.Image': true
    'WeltiFurrer.Site:Mixin.Link': true
  ui:
    label: 'News-Eintrag'
    icon: 'file-alt'
  properties:
    title:
      type: string
      ui:
        inlineEditable: true
        inline:
          editorOptions:
            autoparagraph: false
            placeholder: 'Titel'
    date:
      type: string
      ui:
        inlineEditable: true
        inline:
          editorOptions:
            autoparagraph: false
            placeholder: 'Datum'
    category:
      type: string
      ui:
        inlineEditable: true
        inline:
          editorOptions:
            autoparagraph: false
            placeholder: 'Kategorie'

# --- Aufruf (CTA) ----------------------------------------------------------
'WeltiFurrer.Site:Content.CtaBand':
  superTypes:
    'WeltiFurrer.Site:Content': true
    'WeltiFurrer.Site:Mixin.Headline': true
    'WeltiFurrer.Site:Mixin.Text': true
