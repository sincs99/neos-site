# --- Standorte -------------------------------------------------------------
'WeltiFurrer.Site:Content.LocationList':
  superTypes:
    'WeltiFurrer.Site:Content': true
    'WeltiFurrer.Site:Mixin.Headline': true
    'WeltiFurrer.Site:Mixin.Text': true
  ui:
    label: 'Standorte'
    icon: 'map-marker-alt'
  childNodes:
    items:
      type: 'WeltiFurrer.Site:Collection.Locations'

'WeltiFurrer.Site:Collection.Locations':
  superTypes:
    'Neos.Neos:ContentCollection': true
  constraints:
    nodeTypes:
      '*': false
      'WeltiFurrer.Site:Content.Location': true

'WeltiFurrer.Site:Content.Location':
  superTypes:
    'WeltiFurrer.Site:Content': true
    'WeltiFurrer.Site:Mixin.Text': true
  ui:
    label: 'Standort'
    icon: 'map-marker'
  properties:
    title:
      type: string
      ui:
        inlineEditable: true
