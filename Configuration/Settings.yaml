# Docker auf Centauri: Zugangsdaten kommen aus den Umgebungsvariablen (docker-compose.yml / .env)
Neos:
  Flow:
    persistence:
      backendOptions:
        driver: pdo_mysql
        host: '%env:DB_HOST%'
        dbname: '%env:DB_NAME%'
        user: '%env:DB_USER%'
        password: '%env:DB_PASSWORD%'
        charset: utf8mb4
  Imagine:
    driver: Imagick
